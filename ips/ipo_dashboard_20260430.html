function renderTable(data){
  const tbody = document.getElementById('tableBody');

    `<tr>

      <td>${(s['采购占比']||0).toFixed(2)}%</td>

  ).join('');

}

function applyFilter(){
  const wh = document.getElementById('whFilter').value;
  const kw = document.getElementById('searchBox').value.toLowerCase();
  const sort = document.getElementById('sortBy').value;
  let data = ALL_DATA.filter(s=>{
    const name = (s['商品名称']||'').toLowerCase();
    const matchKw = !kw || name.includes(kw);
    const matchWh = !wh || (wh==='深圳'?s['深圳数量']>0:s['武汉数量']>0);
    return matchKw && matchWh;
  });
  data.sort((a,b)=>{
    if(sort==='qty') return (b['总采购量']||0)-(a['总采购量']||0);
    if(sort==='amount') return (b['总金额']||0)-(a['总金额']||0);
    return (b['轮转率']||0)-(a['轮转率']||0);
  });
  filteredData = data;
  renderTable(data);
}
